<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bastion Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a war-table — the map is the hero on the left, a brass-trimmed field ledger on the right (stacks below on phones). */
/* Deliberately single-theme: the game world is a night-time moss field, so it stays dark on any host. */
:root {
  color-scheme: dark;
  --ground: #121a15;
  --panel: #1b2620;
  --panel-2: #23312a;
  --line: #34463b;
  --ink: #ece6d2;
  --muted: #9aa894;
  --brass: #d9a84e;
  --brass-ink: #1a1408;
  --danger: #e2654c;
  --good: #8fc76c;
  --ice: #8fd3e8;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 12px 20px;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.shell { max-width: 1340px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* ---------- Top bar ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; margin: 0; }
.brand span { color: var(--brass); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-right: auto; }
.stat { display: flex; align-items: baseline; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; }
.stat-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-family: var(--font-mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat-value.lives { color: var(--danger); }
.stat-value.gold { color: var(--brass); }
.stat.flash { animation: flash 0.5s ease-out; }
@keyframes flash { from { background: var(--danger); } to { background: var(--panel); } }

.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.btn.primary:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn .kbd { font-family: var(--font-mono); font-size: 11px; opacity: 0.6; margin-left: 6px; }

/* ---------- Main layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.board { position: relative; width: 100%; max-width: 100%; aspect-ratio: 960 / 600; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--panel); touch-action: manipulation; }
.board canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; background: rgba(10, 15, 12, 0.78); padding: 16px; }
.overlay-card { margin: auto; max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.overlay h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 7vw, 64px); text-transform: uppercase; letter-spacing: 0.03em; line-height: 0.95; margin: 0; text-wrap: balance; }
.overlay h2 span { color: var(--brass); }
.overlay p { margin: 0; color: var(--muted); text-wrap: pretty; }
.overlay .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* ---------- Ledger (side panel) ---------- */
.ledger { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
.ledger section { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ledger section + section { border-top: 1px solid var(--line); }
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; justify-content: space-between; }

.shop { display: flex; flex-direction: column; gap: 6px; }
.shop-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: var(--radius); padding: 6px 10px 6px 6px; cursor: pointer; }
.shop-item:hover { border-color: var(--line); }
.shop-item.active { border-color: var(--brass); background: #2c3b31; }
.shop-item.poor .shop-cost { color: var(--danger); }
.shop-item canvas { width: 40px; height: 40px; }
.shop-name { font-weight: 600; display: block; line-height: 1.2; }
.shop-desc { font-size: 12.5px; color: var(--muted); display: block; line-height: 1.3; }
.shop-cost { font-family: var(--font-mono); font-weight: 700; color: var(--brass); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.shop-cost .kbd { font-size: 10px; color: var(--muted); font-weight: 500; }

.info h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.03em; text-transform: uppercase; margin: 0; line-height: 1; }
.sel-head { display: flex; gap: 10px; align-items: center; }
.sel-head canvas { width: 48px; height: 48px; flex: none; }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pip { width: 18px; height: 5px; border-radius: 2px; background: var(--line); }
.pip.on { background: var(--brass); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
dl.kv dd .next { color: var(--good); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 0; font-size: 12.5px; cursor: pointer; }
.seg button.on { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.meta { font-size: 12.5px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }

.wave-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.wave-list li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.wave-list .count { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.trait { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.tips { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.tips b { color: var(--ink); font-weight: 600; }

.overlay-card.wide { max-width: 700px; width: 100%; }
.maps, .perks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.map-btn, .perk { display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; min-width: 0; position: relative; }
.map-btn:hover, .perk:hover { border-color: var(--brass); }
.map-btn.on { border-color: var(--brass); background: #2c3b31; }
.map-btn b, .pk-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1.05; }
.map-btn small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.map-btn .best { font-family: var(--font-mono); font-size: 11px; color: var(--brass); margin-top: 2px; }
.pk-up { color: var(--good); font-size: 13.5px; }
.pk-down { color: var(--danger); font-size: 13.5px; }
.pk-key { position: absolute; top: 8px; right: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.abil { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.abil-btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; }
.abil-btn .ab-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(217, 168, 78, 0.18); }
.abil-btn.ready { border-color: var(--brass); }
.abil-btn.ready .ab-fill { background: rgba(217, 168, 78, 0.12); }
.abil-btn.armed { background: #3a2a1c; border-color: var(--danger); }
.ab-text { position: relative; display: flex; flex-direction: column; min-width: 0; }
.ab-text b { font-weight: 600; }
.ab-text small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.ab-cd { position: relative; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--brass); font-size: 13px; }

.branches { display: grid; gap: 6px; }
.branch { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; }
.branch:hover:not(:disabled) { border-color: var(--brass); }
.branch:disabled { opacity: 0.5; cursor: not-allowed; }
.br-top { display: flex; justify-content: space-between; gap: 8px; }
.br-top b { font-family: var(--font-display); font-size: 19px; letter-spacing: 0.03em; text-transform: uppercase; font-weight: 700; line-height: 1.1; }
.br-cost { font-family: var(--font-mono); color: var(--brass); font-weight: 700; }
.br-desc { font-size: 13px; }
.br-stats { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .shop { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .shop-item { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; padding: 6px 4px; gap: 4px; }
  .shop-desc, .shop-cost .kbd { display: none; }
  .shop-name { font-size: 12px; }
  .shop-cost { align-items: center; }
}
@media (max-width: 520px) {
  .brand { font-size: 24px; }
  .stat { padding: 4px 8px; }
  .stat-value { font-size: 15px; }
  .btn { padding: 7px 10px; }
  .btn .kbd { display: none; }
  .overlay { padding: 10px; }
  .overlay-card { gap: 8px; }
  .overlay h2 { font-size: 30px; }
  .overlay p { font-size: 13px; line-height: 1.35; }
  .overlay .desk { display: none; }
  .map-btn small { display: none; }
  .map-btn { padding: 6px 8px; }
  .map-btn b { font-size: 16px; }
  .perks { grid-template-columns: 1fr; gap: 6px; }
  .perk { padding: 7px 10px; gap: 1px; }
  .pk-name { font-size: 17px; }
  .pk-up, .pk-down { font-size: 12.5px; }
  .ab-text small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .stat.flash { animation: none; } }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <h1 class="brand">Bastion <span>Line</span></h1>
    <div class="stats" aria-live="polite">
      <div class="stat" id="stat-lives"><span class="stat-label">Lives</span><span class="stat-value lives" id="v-lives">20</span></div>
      <div class="stat"><span class="stat-label">Gold</span><span class="stat-value gold" id="v-gold">0</span></div>
      <div class="stat"><span class="stat-label">Wave</span><span class="stat-value" id="v-wave">0 / 30</span></div>
    </div>
    <div class="controls">
      <button class="btn primary" id="btn-wave">Send wave 1<span class="kbd">Space</span></button>
      <button class="btn" id="btn-speed" aria-label="Game speed">1× speed<span class="kbd">F</span></button>
      <button class="btn" id="btn-pause">Pause<span class="kbd">P</span></button>
      <button class="btn" id="btn-sound" aria-label="Toggle sound">Sound on<span class="kbd">M</span></button>
    </div>
  </header>

  <div class="layout">
    <div class="left">
    <div class="board" id="board">
      <canvas id="game" aria-label="Battlefield. Choose a tower, then click an empty grass tile to build."></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card" id="overlay-card"></div>
      </div>
    </div>
    <div class="abil" aria-label="Abilities">
      <button class="abil-btn" id="ab-strike" type="button"><span class="ab-fill"></span><span class="ab-text"><b>Barrage</b><small>Q · Five shells on a patch of road</small></span><span class="ab-cd"></span></button>
      <button class="abil-btn" id="ab-snap" type="button"><span class="ab-fill"></span><span class="ab-text"><b>Cold Snap</b><small>W · Slow every enemy for 5s</small></span><span class="ab-cd"></span></button>
    </div>
    </div>

    <aside class="ledger">
      <section>
        <p class="eyebrow"><span>Build</span><span>Esc to cancel</span></p>
        <div class="shop" id="shop"></div>
      </section>
      <section class="info" id="info"></section>
    </aside>
  </div>
</div>

<script>
(() => {
'use strict';

// ===================================================================
// Constants & data
// ===================================================================
const TILE = 40, COLS = 24, ROWS = 15, W = COLS * TILE, H = ROWS * TILE;
const VICTORY_WAVE = 30;
const START_GOLD = 180, START_LIVES = 20;
const REDUCED_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// Maps: path waypoints in tile coordinates (enemies enter left, exit right at the gate).
const MAPS = [
  { name: 'Switchback', blurb: 'A long winding road with plenty of corners.', seed: 42,
    wp: [[-1, 2], [5, 2], [5, 7], [2, 7], [2, 12], [10, 12], [10, 4], [15, 4], [15, 11], [20, 11], [20, 6], [24, 6]] },
  { name: 'The Serpent', blurb: 'Four long climbs. Made for slow fields.', seed: 11,
    wp: [[-1, 12], [4, 12], [4, 3], [9, 3], [9, 10], [14, 10], [14, 3], [19, 3], [19, 12], [24, 12]] },
  { name: 'Short Fuse', blurb: 'A short road. Enemies arrive fast. Hard.', seed: 5,
    wp: [[-1, 7], [6, 7], [6, 2], [12, 2], [12, 12], [18, 12], [18, 7], [24, 7]] },
];
let WAYPOINTS, segs, pathLen, pathSet, rockSet, airA, airB, airLen, MAP_I = 0;

const TOWERS = {
  arrow: {
    name: 'Archer', key: '1', color: '#d9a84e', cost: 50, up: [60, 110], air: true,
    desc: 'Quick single shots. Hits air.',
    lv: [{ dmg: 8, rate: 2.0, range: 3.0 }, { dmg: 14, rate: 2.4, range: 3.4 }],
    br: [
      { name: 'Ranger', desc: 'Rapid fire', dmg: 17, rate: 4.8, range: 3.8 },
      { name: 'Ballista', desc: 'Heavy bolts that ignore armor', dmg: 40, rate: 2.0, range: 4.4, pierce: true },
    ],
  },
  cannon: {
    name: 'Mortar', key: '2', color: '#c46a45', cost: 90, up: [100, 170], air: false,
    desc: 'Splash damage. Ground only.',
    lv: [{ dmg: 22, rate: 0.7, range: 2.8, splash: 0.9 }, { dmg: 40, rate: 0.8, range: 3.1, splash: 1.1 }],
    br: [
      { name: 'Bombard', desc: 'Enormous blast radius', dmg: 62, rate: 0.95, range: 3.4, splash: 1.9 },
      { name: 'Napalm', desc: 'Sets enemies on fire', dmg: 45, rate: 0.9, range: 3.4, splash: 1.3, burn: 16 },
    ],
  },
  frost: {
    name: 'Frost Spire', key: '3', color: '#8fd3e8', cost: 70, up: [80, 140], air: true,
    desc: 'Pulses to slow everything nearby.',
    lv: [{ dmg: 3, rate: 0.8, range: 2.4, slow: 0.35, slowDur: 1.6 }, { dmg: 6, rate: 0.9, range: 2.7, slow: 0.45, slowDur: 1.8 }],
    br: [
      { name: 'Glacier', desc: 'Every 4th pulse freezes enemies solid', dmg: 4, rate: 0.9, range: 3.2, slow: 0.55, slowDur: 2.2, freeze: 4 },
      { name: 'Blizzard', desc: 'Wide pulses that hurt', dmg: 22, rate: 1.2, range: 3.7, slow: 0.45, slowDur: 1.8 },
    ],
  },
  tesla: {
    name: 'Tesla Coil', key: '4', color: '#b18cf0', cost: 120, up: [130, 210], air: true,
    desc: 'Chain lightning. Ignores armor.',
    lv: [{ dmg: 15, rate: 1.0, range: 2.6, chain: 3 }, { dmg: 24, rate: 1.15, range: 2.9, chain: 4 }],
    br: [
      { name: 'Storm', desc: 'Chains through ten enemies', dmg: 30, rate: 1.3, range: 3.4, chain: 10 },
      { name: 'Arc Lance', desc: 'One brutal bolt', dmg: 110, rate: 0.9, range: 3.4, chain: 2 },
    ],
  },
  sniper: {
    name: 'Longshot', key: '5', color: '#e9e2c9', cost: 150, up: [150, 250], air: true,
    desc: 'Huge range, heavy hits. Slow.',
    lv: [{ dmg: 60, rate: 0.45, range: 6.0 }, { dmg: 115, rate: 0.5, range: 7.0 }],
    br: [
      { name: 'Assassin', desc: 'Armor-piercing killshots', dmg: 380, rate: 0.42, range: 9.0, pierce: true },
      { name: 'Gunner', desc: 'Fast, steady fire', dmg: 120, rate: 1.1, range: 8.0 },
    ],
  },
};
const mods0 = () => ({ dmg: 1, rate: 1, range: 0, hp: 1, speed: 1, armor: 0, bounty: 1, build: 1, upCost: 1, sell: 0.7, cd: 1 });
function baseStats(type, lvl, branch) { const d = TOWERS[type]; return lvl < 2 ? d.lv[lvl] : d.br[branch || 0]; }
function scaled(st) {
  const m = S.mods;
  return { ...st, dmg: st.dmg * m.dmg, rate: st.rate * m.rate, range: st.range + m.range, burn: st.burn && st.burn * m.dmg };
}
function tStats(t) {
  if (t._s && t._v === S.modVer && t._l === t.lvl && t._b === t.branch) return t._s;
  t._s = scaled(baseStats(t.type, t.lvl, t.branch)); t._v = S.modVer; t._l = t.lvl; t._b = t.branch;
  return t._s;
}
const buildCost = type => Math.round(TOWERS[type].cost * S.mods.build);

// Field orders: a gift with a price, offered before every fifth wave.
const PERKS = [
  { id: 'chest', name: 'War Chest', up: '+150 gold now', down: 'Enemies have 8% more health', apply: m => { S.gold += 150; m.hp *= 1.08; } },
  { id: 'steel', name: 'Hardened Steel', up: 'Towers deal 20% more damage', down: 'Enemy armor +1', apply: m => { m.dmg *= 1.2; m.armor += 1; } },
  { id: 'drill', name: 'Drill Sergeant', up: 'Towers fire 15% faster', down: 'Enemies move 8% faster', apply: m => { m.rate *= 1.15; m.speed *= 1.08; } },
  { id: 'sight', name: 'Far Sight', up: 'Tower range +0.5 tiles', down: 'Enemies move 8% faster', apply: m => { m.range += 0.5; m.speed *= 1.08; } },
  { id: 'salvage', name: 'Salvage Crews', up: 'Selling refunds 100%', down: 'Upgrades cost 15% more', apply: m => { m.sell = 1; m.upCost *= 1.15; } },
  { id: 'levy', name: 'Royal Levy', up: '+5 lives', down: 'Kills pay 15% less', apply: m => { S.lives = Math.min(99, S.lives + 5); m.bounty *= 0.85; } },
  { id: 'bounty', name: 'Bounty Hunters', up: 'Kills pay 30% more', down: 'Enemies have 10% more health', apply: m => { m.bounty *= 1.3; m.hp *= 1.1; } },
  { id: 'mason', name: 'Cheap Masons', up: 'New towers cost 20% less', down: 'Enemies have 6% more health', apply: m => { m.build *= 0.8; m.hp *= 1.06; } },
  { id: 'flare', name: 'Signal Flares', up: 'Abilities recharge 30% faster', down: 'Enemies have 6% more health', apply: m => { m.cd *= 0.7; m.hp *= 1.06; } },
];
const ABIL = { strike: { cd: 40, name: 'Barrage' }, snap: { cd: 55, name: 'Cold Snap' } };

// ---------- Sound (synthesized, no assets) ----------
const A = { ctx: null, on: true, master: null, last: {}, noiseBuf: null };
try { A.on = localStorage.getItem('bastion-line-mute') !== '1'; } catch (e) {}
function initAudio() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    A.ctx = new AC(); A.master = A.ctx.createGain(); A.master.gain.value = 0.5; A.master.connect(A.ctx.destination);
    const n = A.ctx.sampleRate * 0.5, buf = A.ctx.createBuffer(1, n, A.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    A.noiseBuf = buf;
  } catch (e) { A.ctx = null; }
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  const c = A.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();

  updateShots(dt);
  S.enemies = S.enemies.filter(e => e.alive);
  if (S.waveActive && !S.spawns.length && !S.enemies.length) {
    S.waveActive = false;
    const b = waveBonus(S.wave);
    S.gold += b;
    S.banner = { text: 'Wave ' + S.wave + ' cleared', sub: '+' + b + ' gold', life: 2.2 };
    saveBest(S.wave); sfx('clear');
    if (S.wave >= VICTORY_WAVE && !S.won && !S.endless) { S.won = true; victory(); }
    else if (S.wave % 5 === 4) offerPerks();
  }
  updateFx(dt);
}

function strikeBlast(k) {
  const R = 1.1 * TILE, dmg = 60 + 5 * S.wave;
  for (const e of S.enemies) if (e.alive && e.d >= 0 && Math.hypot(e.x - k.x, e.y - k.y) <= R) hurt(e, dmg, null, true);
  ring(k.x, k.y, 4, R, 0.4, '#f0a35a'); burst(k.x, k.y, '#f0a35a', 18, 140); sfx('boom');
}
function abilLeft(k) { return Math.max(0, S.ab[k] - S.time); }
function useAbility(k, x, y) {
  if (S.over || !ui.started || ui.perkOpen) return false;
  if (abilLeft(k) > 0) { sfx('nope'); return false; }
  if (k === 'strike') {
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 1.6 * TILE;
      S.strikes.push({ at: S.time + 0.35 + i * 0.2, x: Math.max(0, Math.min(W, x + Math.cos(a) * r)), y: Math.max(0, Math.min(H, y + Math.sin(a) * r)) });
    }
    sfx('whistle');
  } else {
    for (const e of S.enemies) if (e.alive) { e.slowF = Math.max(e.slowT > 0 ? e.slowF : 0, 0.75); e.slowT = Math.max(e.slowT, 5); }
    ring(W / 2, H / 2, 20, W * 0.6, 0.8, '#8fd3e8'); sfx('snap');
    S.banner = { text: 'Cold snap', sub: 'Every enemy slows for 5 seconds', life: 1.6 };
  }
  S.ab[k] = S.time + ABIL[k].cd * S.mods.cd;
  return true;
}
function toggleStrike() {
  if (S.over || !ui.started || ui.perkOpen) return;
  if (ui.targeting) { ui.targeting = null; return; }
  if (abilLeft('strike') > 0) { sfx('nope'); return; }
  ui.targeting = 'strike'; ui.build = null; ui.selected = null; refreshPanel(true);
}

function updateFx(dt) {
  for (const p of S.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const t of S.texts) { t.life -= dt; t.y -= 26 * dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const arr of [S.rings, S.bolts, S.tracers]) for (const r of arr) r.life -= dt;
  S.rings = S.rings.filter(r => r.life > 0);
  S.bolts = S.bolts.filter(r => r.life > 0);
  S.tracers = S.tracers.filter(r => r.life > 0);
  if (S.banner) { S.banner.life -= dt; if (S.banner.life <= 0) S.banner = null; }
}

function burst(x, y, color, n, spd) {
  if (REDUCED_MOTION) n = Math.ceil(n / 3);
  if (S.particles.length > 500) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.7);
    S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.3 + Math.random() * 0.4, max: 0.7, color, size: 1.5 + Math.random() * 2 });
  }
}
function ring(x, y, r0, r1, life, color) { S.rings.push({ x, y, r0, r1, life, max: life, color }); }
function floatText(x, y, text, color) { if (S.texts.length < 60) S.texts.push({ x, y, text, color, life: 0.9, max: 0.9 }); }

// ===================================================================
// Rendering
// ===================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;

const bg = document.createElement('canvas');
bg.width = W * DPR; bg.height = H * DPR;
function drawBackground() {
  const g = bg.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = rng(7);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const v = r();
    g.fillStyle = (x + y) % 2 ? `hsl(140, 18%, ${13 + v * 2.5}%)` : `hsl(138, 20%, ${14.5 + v * 2.5}%)`;
    g.fillRect(x * TILE, y * TILE, TILE, TILE);
  }
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `hsla(${110 + r() * 40}, 30%, ${22 + r() * 14}%, ${0.25 + r() * 0.3})`;
    const x = r() * W, y = r() * H;
    g.fillRect(x, y, 1, 2 + r() * 3);
  }
  // path
  g.lineJoin = 'round'; g.lineCap = 'square';
  const stroke = (w, c) => {
    g.beginPath(); g.moveTo(segs[0].x1, segs[0].y1);
    for (const s of segs) g.lineTo(s.x2, s.y2);
    g.strokeStyle = c; g.lineWidth = w; g.stroke();
  };
  stroke(TILE + 4, '#2a2418');
  stroke(TILE - 2, '#6b5a3c');
  stroke(TILE - 12, '#7a6644');
  for (let i = 0; i < 1400; i++) {
    const s = segs[Math.floor(r() * segs.length)], t = r();
    const x = s.x1 + (s.x2 - s.x1) * t + (r() - 0.5) * (TILE - 8), y = s.y1 + (s.y2 - s.y1) * t + (r() - 0.5) * (TILE - 8);
    g.fillStyle = `rgba(${r() < 0.5 ? '40,30,18' : '160,135,95'},${0.25 + r() * 0.3})`;
    g.fillRect(x, y, 1.5, 1.5);
  }
  // rocks
  for (const k of rockSet) {
    const [tx, ty] = k.split(',').map(Number), cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
    const n = 2 + Math.floor(r() * 2);
    for (let i = 0; i < n; i++) {
      const ox = (r() - 0.5) * 18, oy = (r() - 0.5) * 14, rad = 6 + r() * 7;
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.beginPath(); g.ellipse(cx + ox + 2, cy + oy + 4, rad, rad * 0.7, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = `hsl(150, 6%, ${32 + r() * 12}%)`;
      g.beginPath(); g.ellipse(cx + ox, cy + oy, rad, rad * 0.78, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.12)';
      g.beginPath(); g.ellipse(cx + ox - rad * 0.3, cy + oy - rad * 0.3, rad * 0.4, rad * 0.28, 0, 0, Math.PI * 2); g.fill();
    }
  }
  // faint dotted route flyers take
  g.setLineDash([3, 9]); g.strokeStyle = 'rgba(143,211,232,0.3)'; g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath(); g.moveTo(airA[0], airA[1]); g.lineTo(airB[0], airB[1]); g.stroke(); g.setLineDash([]);
  // the bastion gate at the exit
  const gx = W - 18, gy = (WAYPOINTS[WAYPOINTS.length - 1][1] + 0.5) * TILE;
  g.fillStyle = '#3d3a33'; g.fillRect(gx - 6, gy - 34, 26, 68);
  g.fillStyle = '#56524a';
  for (const cx of [gx - 6, gx + 4, gx + 14]) g.fillRect(cx, gy - 42, 6, 8);
  g.fillStyle = '#1a140c'; g.beginPath(); g.moveTo(gx - 6, gy + 18); g.lineTo(gx - 6, gy - 8); g.quadraticCurveTo(gx + 4, gy - 22, gx + 14, gy - 8); g.lineTo(gx + 14, gy + 18); g.fill();
  g.fillStyle = '#d9a84e'; g.fillRect(gx + 2, gy - 60, 2, 20);
  g.beginPath(); g.moveTo(gx + 4, gy - 60); g.lineTo(gx + 18, gy - 55); g.lineTo(gx + 4, gy - 50); g.fill();
  // spawn marker
  g.fillStyle = 'rgba(226,101,76,0.6)';
  const sy = (WAYPOINTS[0][1] + 0.5) * TILE;
  g.beginPath(); g.moveTo(4, sy - 9); g.lineTo(16, sy); g.lineTo(4, sy + 9); g.fill();
}

function drawTower(c, type, lvl, x, y, angle, scale = 1, flash = 0, branch = -1) {
  const def = TOWERS[type];
  c.save(); c.translate(x, y); c.scale(scale, scale);
  // base
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(2, 5, 17, 13, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#4a4a40'; roundRect(c, -16, -16, 32, 32, 6); c.fill();
  c.fillStyle = '#5d5c50'; roundRect(c, -14, -14, 28, 26, 5); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-14, -2); c.lineTo(14, -2); c.moveTo(0, -14); c.lineTo(0, -2); c.stroke();
  // level pips
  for (let i = 0; i <= lvl; i++) { c.fillStyle = '#d9a84e'; c.fillRect(-10 + i * 8, 11, 5, 3); }
  if (lvl >= 2 && branch >= 0) { c.fillStyle = branch ? '#7fd7ff' : '#ff9b54'; c.beginPath(); c.arc(12, -12, 3.2, 0, 6.283); c.fill(); c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1; c.stroke(); }
  const col = def.color;
  switch (type) {
    case 'arrow':
      c.rotate(angle);
      c.fillStyle = '#6b4a2a'; c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.fill();
      c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.arc(2, 0, 11, -1.1, 1.1); c.stroke();
      c.strokeStyle = '#ece6d2'; c.lineWidth = 1; c.beginPath(); c.moveTo(2 + Math.cos(-1.1) * 11, Math.sin(-1.1) * 11); c.lineTo(flash ? 2 : -3, 0); c.lineTo(2 + Math.cos(1.1) * 11, Math.sin(1.1) * 11); c.stroke();
      c.fillStyle = '#ece6d2'; c.fillRect(-3, -1, 16, 2);
      break;
    case 'cannon':
      c.fillStyle = '#3a3630'; c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
      c.rotate(angle);
      c.fillStyle = col; roundRect(c, -4, -6 - lvl, 20 - (flash ? 4 : 0), 12 + lvl * 2, 3); c.fill();
      c.fillStyle = '#2a2420'; c.beginPath(); c.arc(0, 0, 7, 0, Math.PI * 2); c.fill();
      break;
    case 'frost': {
      c.fillStyle = 'rgba(143,211,232,' + (0.15 + flash * 2) + ')'; c.beginPath(); c.arc(0, 0, 14, 0, Math.PI * 2); c.fill();
      c.fillStyle = col;
      c.beginPath(); c.moveTo(0, -18 - lvl * 2); c.lineTo(7, 0); c.lineTo(0, 6); c.lineTo(-7, 0); c.closePath(); c.fill();
      c.fillStyle = '#d8f3fb'; c.beginPath(); c.moveTo(0, -18 - lvl * 2); c.lineTo(3, -2); c.lineTo(0, 4); c.closePath(); c.fill();
      c.fillStyle = '#5fa9c2'; c.beginPath(); c.moveTo(-9, 2); c.lineTo(-4, -8); c.lineTo(-2, 4); c.fill(); c.beginPath(); c.moveTo(9, 2); c.lineTo(4, -8); c.lineTo(2, 4); c.fill();
      break;
    }
    case 'tesla':
      c.fillStyle = '#3b3446'; roundRect(c, -7, -6, 14, 14, 3); c.fill();
      c.strokeStyle = '#c8a46a'; c.lineWidth = 2;
      for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(0, -2 - i * 4, 7 - i, 2.5, 0, 0, Math.PI * 2); c.stroke(); }
      c.fillStyle = flash ? '#ffffff' : col; c.shadowColor = col; c.shadowBlur = 8 + flash * 60;
      c.beginPath(); c.arc(0, -16, 5 + lvl, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
      break;
    case 'sniper':
      c.fillStyle = '#2f3330'; c.beginPath(); c.arc(0, 0, 10, 0, Math.PI * 2); c.fill();
      c.rotate(angle);
      c.fillStyle = col; c.fillRect(-2, -2.5, 26 + lvl * 2, 5);
      c.fillStyle = '#2f3330'; c.fillRect(6, -6, 8, 3);
      c.fillStyle = '#8a8676'; c.fillRect(-8, -5, 10, 10);
      if (flash) { c.fillStyle = 'rgba(255,240,200,0.9)'; c.beginPath(); c.arc(28 + lvl * 2, 0, 5, 0, Math.PI * 2); c.fill(); }
      break;
  }
  c.restore();
}

function drawEnemy(c, e) {
  const d = ENEMIES[e.type], r = d.size;
  const bob = e.air ? Math.sin(e.wob) * 2 - 10 : Math.abs(Math.sin(e.wob)) * -1.5;
  c.save();
  // shadow
  c.fillStyle = 'rgba(0,0,0,' + (e.air ? 0.22 : 0.35) + ')';
  c.beginPath(); c.ellipse(e.x + 1, e.y + r * 0.55, r * 0.95, r * 0.45, 0, 0, Math.PI * 2); c.fill();
  c.translate(e.x, e.y + bob);
  const fill = e.hitT > 0 ? '#ffffff' : d.color;
  c.fillStyle = fill;
  switch (e.type) {
    case 'grunt':
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(-r + 2, -2, r * 2 - 4, 3);
      break;
    case 'runner':
      c.beginPath(); c.moveTo(r + 3, 0); c.lineTo(-r, -r); c.lineTo(-r * 0.4, 0); c.lineTo(-r, r); c.closePath(); c.fill();
      break;
    case 'tank':
      roundRect(c, -r, -r * 0.85, r * 2, r * 1.7, 3); c.fill();
      c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(-r, -r * 0.85, r * 2, 4); c.fillRect(-r, r * 0.85 - 4, r * 2, 4);
      c.fillStyle = 'rgba(255,255,255,0.22)'; c.fillRect(-r + 4, -3, r * 2 - 8, 6);
      break;
    case 'swarm':
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      break;
    case 'flyer': {
      const flap = Math.sin(e.wob * 2.5) * 4;
      c.beginPath(); c.moveTo(r, 0); c.lineTo(-2, -r - flap); c.lineTo(-r * 0.6, 0); c.lineTo(-2, r + flap); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.arc(2, 0, 3, 0, Math.PI * 2); c.fill();
      break;
    }
    case 'healer':
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = e.hitT > 0 ? d.color : '#f3fbe9'; c.fillRect(-2, -6, 4, 12); c.fillRect(-6, -2, 12, 4);
      break;
    case 'boss':
      c.beginPath();
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + e.wob * 0.1, rr = i % 2 ? r * 0.78 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.closePath(); c.fill();
      c.fillStyle = '#d9a84e'; c.beginPath(); c.moveTo(-8, -4); c.lineTo(-8, -12); c.lineTo(-4, -7); c.lineTo(0, -14); c.lineTo(4, -7); c.lineTo(8, -12); c.lineTo(8, -4); c.fill();
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.arc(0, 3, 7, 0, Math.PI * 2); c.fill();
      break;
  }
  if (e.slowT > 0) { c.strokeStyle = 'rgba(143,211,232,0.85)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r + 3, 0, Math.PI * 2); c.stroke(); }
  if (e.freezeT > 0) { c.strokeStyle = '#effcff'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, r + 4, 0, Math.PI * 2); c.stroke(); }
  if (e.burnT > 0) { c.strokeStyle = 'rgba(255,140,60,0.9)'; c.lineWidth = 2; c.setLineDash([3, 3]); c.beginPath(); c.arc(0, 0, r + 5, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
  c.restore();
  // health bar
  if (e.hp < e.maxHp) {
    const bw = Math.max(16, r * 2.2), bx = e.x - bw / 2, by = e.y + bob - r - 8;
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(bx - 1, by - 1, bw + 2, 5);
    const f = Math.max(0, e.hp / e.maxHp);
    c.fillStyle = f > 0.5 ? '#8fc76c' : f > 0.25 ? '#e9c75c' : '#e2654c';
    c.fillRect(bx, by, bw * f, 3);
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawRange(x, y, r, ok) {
  ctx.fillStyle = ok ? 'rgba(217,168,78,0.10)' : 'rgba(226,101,76,0.12)';
  ctx.strokeStyle = ok ? 'rgba(217,168,78,0.55)' : 'rgba(226,101,76,0.6)';
  ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);

  // build grid
  if (ui.build) {
    ctx.strokeStyle = 'rgba(236,230,210,0.05)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 1; x < COLS; x++) { ctx.moveTo(x * TILE, 0); ctx.lineTo(x * TILE, H); }
    for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * TILE); ctx.lineTo(W, y * TILE); }
    ctx.stroke();
  }

  // range of selected / hovered tower
  const sel = ui.selected;
  if (sel) drawRange(sel.x, sel.y, tStats(sel).range * TILE, true);
  else if (!ui.build && ui.hoverTile) {
    const h = towerAt(ui.hoverTile[0], ui.hoverTile[1]);
    if (h) drawRange(h.x, h.y, tStats(h).range * TILE, true);
  }

  for (const t of S.towers) {
    drawTower(ctx, t.type, t.lvl, t.x, t.y, t.angle, 1, t.flash, t.lvl >= 2 ? t.branch : -1);
    if (t === sel) { ctx.strokeStyle = '#d9a84e'; ctx.lineWidth = 2; roundRect(ctx, t.x - 19, t.y - 19, 38, 38, 7); ctx.stroke(); }
  }
  for (const e of S.enemies) if (!e.air) drawEnemy(ctx, e);

  // shots
  for (const s of S.shots) {
    if (s.kind === 'arrow') {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a || 0);
      ctx.strokeStyle = '#ece6d2'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(4, 0); ctx.stroke();
      ctx.restore();
    } else {
      const p = s.t / s.dur, x = s.sx + (s.tx - s.sx) * p, y = s.sy + (s.ty - s.sy) * p, hgt = Math.sin(p * Math.PI) * 40;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a2420'; ctx.beginPath(); ctx.arc(x, y - hgt, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(240,163,90,0.8)'; ctx.beginPath(); ctx.arc(x - 1, y - hgt - 1, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  for (const e of S.enemies) if (e.air) drawEnemy(ctx, e);

  // effects
  for (const r of S.rings) {
    const p = 1 - r.life / r.max;
    ctx.strokeStyle = r.color; ctx.globalAlpha = (1 - p) * 0.8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * p, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const b of S.bolts) {
    ctx.globalAlpha = b.life / b.max;
    for (const [w, col] of [[5, 'rgba(177,140,240,0.45)'], [1.8, '#f1e9ff']]) {
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath();
      ctx.moveTo(b.pts[0][0], b.pts[0][1]);
      for (let i = 1; i < b.pts.length; i++) {
        const [ax, ay] = b.pts[i - 1], [bx, by] = b.pts[i];
        for (let k = 1; k <= 4; k++) {
          const t = k / 4, jitter = k < 4 ? (Math.random() - 0.5) * 12 : 0;
          ctx.lineTo(ax + (bx - ax) * t + jitter, ay + (by - ay) * t + jitter);
        }
      }
      ctx.stroke();
    }
  }
  for (const t of S.tracers) {
    ctx.globalAlpha = t.life / t.max;
    ctx.strokeStyle = '#fff3d6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of S.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.font = '700 13px "JetBrains Mono", monospace'; ctx.textAlign = 'center';
  for (const t of S.texts) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 1.6);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(t.text, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  // build ghost
  if (ui.build && ui.hoverTile) {
    const [tx, ty] = ui.hoverTile, x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
    const ok = tileFree(tx, ty) && S.gold >= buildCost(ui.build);
    drawRange(x, y, (TOWERS[ui.build].lv[0].range + S.mods.range) * TILE, ok);
    ctx.globalAlpha = 0.65; drawTower(ctx, ui.build, 0, x, y, -Math.PI / 2); ctx.globalAlpha = 1;
    ctx.strokeStyle = ok ? '#d9a84e' : '#e2654c'; ctx.lineWidth = 2; ctx.strokeRect(tx * TILE + 1, ty * TILE + 1, TILE - 2, TILE - 2);
  }

  // pending barrage impacts and the aiming reticle
  for (const k of S.strikes) {
    ctx.strokeStyle = 'rgba(226,101,76,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(k.x, k.y, 1.1 * TILE, 0, Math.PI * 2); ctx.stroke();
  }
  if (ui.targeting === 'strike' && ui.hoverPx) {
    const [x, y] = ui.hoverPx, R = 1.6 * TILE;
    ctx.fillStyle = 'rgba(226,101,76,0.12)'; ctx.strokeStyle = 'rgba(226,101,76,0.95)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
    ctx.font = '600 14px Barlow, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 150, 8, 300, 24);
    ctx.fillStyle = '#ece6d2'; ctx.fillText('Click to call the barrage · Esc to cancel', W / 2, 25);
  }

  // banner
  if (S.banner) {
    const b = S.banner, a = Math.min(1, b.life * 2, (2.6 - b.life) * 4 + 0.2);
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = 'rgba(10,15,12,0.55)'; ctx.fillRect(0, H / 2 - 46, W, 84);
    ctx.textAlign = 'center';
    ctx.fillStyle = b.boss ? '#e2654c' : '#ece6d2';
    ctx.font = '800 46px "Big Shoulders Display", Impact, sans-serif';
    ctx.fillText(b.text.toUpperCase(), W / 2, H / 2 + 4);
    ctx.fillStyle = '#d9a84e'; ctx.font = '600 16px Barlow, sans-serif';
    ctx.fillText(b.sub, W / 2, H / 2 + 28);
    ctx.globalAlpha = 1;
  }
}

// ===================================================================
// UI: HUD, shop, info panel
// ===================================================================
const $ = id => document.getElementById(id);
const els = { lives: $('v-lives'), gold: $('v-gold'), wave: $('v-wave'), btnWave: $('btn-wave'), btnSpeed: $('btn-speed'), btnPause: $('btn-pause'), shop: $('shop'), info: $('info'), overlay: $('overlay'), card: $('overlay-card'), btnSound: $('btn-sound'), ab: { strike: $('ab-strike'), snap: $('ab-snap') } };

function iconCanvas(type, size) {
  const c = document.createElement('canvas');
  c.width = size * DPR; c.height = size * DPR;
  const g = c.getContext('2d'); g.scale(DPR * size / 44, DPR * size / 44);
  drawTower(g, type, 0, 22, 22, -Math.PI / 4);
  return c;
}

for (const k of TOWER_KEYS) {
  const d = TOWERS[k];
  const b = document.createElement('button');
  b.className = 'shop-item'; b.dataset.type = k; b.type = 'button';
  b.setAttribute('aria-label', `${d.name}, ${d.cost} gold. ${d.desc}`);
  b.appendChild(iconCanvas(k, 40));
  const txt = document.createElement('span');
  txt.innerHTML = `<span class="shop-name">${d.name}</span><span class="shop-desc">${d.desc}</span>`;
  b.appendChild(txt);
  const cost = document.createElement('span'); cost.className = 'shop-cost';
  cost.innerHTML = `<span class="cc">${d.cost}g</span><span class="kbd">key ${d.key}</span>`;
  b.appendChild(cost);
  b.addEventListener('click', () => selectBuild(ui.build === k ? null : k));
  els.shop.appendChild(b);
}

function selectBuild(type) { ui.build = type; if (type) { ui.selected = null; ui.targeting = null; } refreshPanel(true); }

let lastSig = '';
const MODES = [['first', 'First'], ['last', 'Last'], ['strong', 'Strong'], ['close', 'Close']];
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

function statRows(a, b) {
  const row = (label, f, unit = '') => {
    const va = f(a), vb = b ? f(b) : null;
    return `<dt>${label}</dt><dd>${va}${unit}${vb != null && vb !== va ? ` <span class="next">→ ${vb}${unit}</span>` : ''}</dd>`;
  };
  let h = row('Damage', s => Math.round(s.dmg)) + row('Shots / sec', s => s.rate.toFixed(2)) + row('Range', s => s.range.toFixed(1), ' tiles');
  if (a.splash) h += row('Splash', s => s.splash.toFixed(1), ' tiles');
  if (a.slow) h += row('Slow', s => Math.round(s.slow * 100), '%');
  if (a.chain) h += row('Chain jumps', s => s.chain);
  if (a.burn) h += row('Burn / sec', s => Math.round(s.burn));
  if (a.freeze) h += row('Freeze every', s => s.freeze, ' pulses');
  if (a.pierce) h += '<dt>Armor</dt><dd>ignored</dd>';
  return h;
}

function refreshPanel(force) {
  for (const b of els.shop.children) {
    const ty = b.dataset.type, c = buildCost(ty);
    b.classList.toggle('active', ty === ui.build);
    b.classList.toggle('poor', S.gold < c);
    const cc = b.querySelector('.cc'), txt = c + 'g';
    if (cc && cc.textContent !== txt) cc.textContent = txt;
  }
  const t = ui.selected;
  let sig;
  if (t) sig = `t${t.id}:${t.lvl}:${t.branch}:${t.mode}:${S.modVer}:${S.gold >= (upgradeCost(t) ?? Infinity)}`;
  else if (ui.build) sig = `b${ui.build}:${S.modVer}:${S.gold >= buildCost(ui.build)}`;
  else sig = `w${S.wave}:${S.waveActive}:${S.modVer}`;
  if (t) { const m = $('sel-meta'); if (m) m.textContent = `${fmt(t.kills)} kills · ${fmt(t.dealt)} damage dealt`; }
  if (!force && sig === lastSig) return;
  lastSig = sig;

  if (t) {
    const d = TOWERS[t.type], c = upgradeCost(t), max = c == null, br = t.lvl >= 2 ? d.br[t.branch] : null;
    const sell = `<button class="btn danger" id="btn-sell" type="button" ${c != null && t.lvl === 1 ? 'style="width:100%"' : ''}>Sell · ${sellValue(t)}g</button>`;
    let actions;
    if (max) actions = `<div class="actions"><button class="btn" type="button" disabled>Max level</button>${sell}</div>`;
    else if (t.lvl === 1) actions = `<div><p class="eyebrow" style="margin-bottom:6px"><span>Choose a path</span><span>U · I</span></p><div class="branches">${d.br.map((b, i) => {
      const s = scaled(b);
      return `<button type="button" class="branch" data-branch="${i}" ${S.gold < c ? 'disabled' : ''}><span class="br-top"><b>${b.name}</b><span class="br-cost">${c}g</span></span><span class="br-desc">${b.desc}</span><span class="br-stats">${Math.round(s.dmg)} dmg · ${s.rate.toFixed(1)}/s · ${s.range.toFixed(1)} range</span></button>`;
    }).join('')}</div></div>${sell}`;
    else actions = `<div class="actions"><button class="btn primary" id="btn-up" type="button" ${S.gold < c ? 'disabled' : ''}>Upgrade · ${c}g</button>${sell}</div>`;
    const next = t.lvl === 0 ? scaled(baseStats(t.type, 1)) : null;
    els.info.innerHTML = `
      <p class="eyebrow"><span>Selected tower</span><span>Esc to close</span></p>
      <div class="sel-head"><span id="sel-icon"></span><div><h3>${br ? br.name : d.name}</h3>
        <div class="pips">${[0, 1, 2].map(i => `<span class="pip${i <= t.lvl ? ' on' : ''}"></span>`).join('')}</div></div></div>
      ${br ? `<p class="meta">${d.name} · ${br.desc}</p>` : ''}
      <dl class="kv">${statRows(tStats(t), next)}</dl>
      <div><p class="eyebrow" style="margin-bottom:6px"><span>Targeting</span><span>T to cycle</span></p>
      <div class="seg" role="group" aria-label="Targeting">${MODES.map(([k, l]) => `<button type="button" data-mode="${k}" class="${t.mode === k ? 'on' : ''}" aria-pressed="${t.mode === k}">${l}</button>`).join('')}</div></div>
      ${actions}
      <p class="meta" id="sel-meta">${fmt(t.kills)} kills · ${fmt(t.dealt)} damage dealt</p>`;
    $('sel-icon').appendChild(iconCanvas(t.type, 48));
    const up = $('btn-up'); if (up) up.onclick = () => { upgradeTower(t, 0); refreshPanel(true); };
    els.info.querySelectorAll('[data-branch]').forEach(b => b.onclick = () => { upgradeTower(t, +b.dataset.branch); refreshPanel(true); });
    $('btn-sell').onclick = () => { sellTower(t); refreshPanel(true); };
    els.info.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { t.mode = b.dataset.mode; refreshPanel(true); });
  } else if (ui.build) {
    const d = TOWERS[ui.build], c = buildCost(ui.build);
    els.info.innerHTML = `
      <p class="eyebrow"><span>Placing</span><span>${c}g</span></p>
      <div class="sel-head"><span id="sel-icon"></span><div><h3>${d.name}</h3><p class="meta">${d.desc}</p></div></div>
      <dl class="kv">${statRows(scaled(d.lv[0]), null)}<dt>Upgrades</dt><dd>${d.up.map(u => Math.round(u * S.mods.upCost) + 'g').join(' · ')}</dd></dl>
      <p class="meta">The second upgrade splits into two paths: ${d.br.map(b => b.name).join(' or ')}.</p>
      <p class="meta">${S.gold >= c ? 'Click any open grass tile to build. Right-click or Esc to stop.' : `Need ${c - S.gold} more gold.`}</p>`;
    $('sel-icon').appendChild(iconCanvas(ui.build, 48));
  } else {
    const nextW = S.wave + 1, groups = waveGroups(nextW);
    const tally = {};
    for (const [type, n] of groups) tally[type] = (tally[type] || 0) + n;
    const hp = hpMul(nextW) * S.mods.hp;
    const orders = S.perks.map(id => PERKS.find(p => p.id === id).name);
    els.info.innerHTML = `
      <p class="eyebrow"><span>Scouting · wave ${nextW}</span><span>HP ×${hp.toFixed(1)}</span></p>
      <ul class="wave-list">${Object.entries(tally).map(([type, n]) => {
        const e = ENEMIES[type];
        return `<li><span class="dot" style="background:${e.color}"></span><span>${e.name}${e.trait ? ` <span class="trait">${e.trait}</span>` : ''}</span><span class="count">×${n}</span></li>`;
      }).join('')}</ul>
      <p class="meta">Clear bonus ${waveBonus(nextW)}g${S.waveActive ? ` · Send it early for +${earlyBonus(nextW)}g` : ''}</p>
      ${orders.length ? `<p class="meta">Field orders: ${orders.join(', ')}</p>` : ''}
      <ul class="tips">
        <li><b>Kites</b> fly straight to the gate over the dotted line. Mortars can’t hit them.</li>
        <li>Armor blunts small hits. <b>Tesla</b>, Ballista and Assassin ignore it.</li>
        <li>Save <b>Barrage</b> and <b>Cold Snap</b> for bosses.</li>
      </ul>`;
  }
}

let shownLives = START_LIVES;
function flashLives() { const s = $('stat-lives'); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); }
function refreshHud() {
  els.lives.textContent = S.lives;
  els.gold.textContent = fmt(S.gold);
  els.wave.textContent = S.endless || S.wave > VICTORY_WAVE ? `${S.wave}` : `${S.wave} / ${VICTORY_WAVE}`;
  const kbd = '<span class="kbd">Space</span>';
  if (!S.waveActive) els.btnWave.innerHTML = `Send wave ${S.wave + 1}${kbd}`;
  else els.btnWave.innerHTML = `Send next early +${earlyBonus(S.wave + 1)}g${kbd}`;
  els.btnWave.disabled = S.over || !ui.started;
  els.btnSpeed.innerHTML = `${ui.speed}× speed<span class="kbd">F</span>`;
  els.btnPause.innerHTML = `${ui.paused && ui.started ? 'Resume' : 'Pause'}<span class="kbd">P</span>`;
  els.btnPause.disabled = !ui.started || S.over || ui.perkOpen;
  if (ui.perkOpen) els.btnWave.disabled = true;
  els.btnSound.innerHTML = `Sound ${A.on ? 'on' : 'off'}<span class="kbd">M</span>`;
  for (const k of ['strike', 'snap']) {
    const b = els.ab[k], left = abilLeft(k), total = ABIL[k].cd * S.mods.cd;
    b.classList.toggle('ready', left === 0);
    b.classList.toggle('armed', ui.targeting === k);
    b.querySelector('.ab-fill').style.width = (left === 0 ? 100 : (1 - left / total) * 100) + '%';
    b.querySelector('.ab-cd').textContent = ui.targeting === k ? 'Aim…' : left === 0 ? 'Ready' : Math.ceil(left) + 's';
  }
}

// ===================================================================
// Overlays
// ===================================================================
function showOverlay(html, cls = '') { els.card.className = 'overlay-card' + (cls ? ' ' + cls : ''); els.card.innerHTML = html; els.overlay.hidden = false; }
function hideOverlay() { els.overlay.hidden = true; }

function titleScreen() {
  ui.started = false; ui.paused = true; ui.perkOpen = false; ui.targeting = null;
  showOverlay(`
    <h2>Bastion <span>Line</span></h2>
    <p>Thirty waves are marching on the gate. Build towers, choose upgrade paths, and don’t let ${START_LIVES} of them through.</p>
    <div class="maps" role="group" aria-label="Choose a map">${MAPS.map((m, i) => `<button type="button" class="map-btn${i === ui.map ? ' on' : ''}" data-map="${i}"><b>${m.name}</b><small>${m.blurb}</small><span class="best">${bestWave(i) ? 'Best: wave ' + bestWave(i) : 'Unplayed'}</span></button>`).join('')}</div>
    <p class="desk">Press <b>1–5</b> to pick a tower and click grass to build. Click a tower to upgrade it. <b>Space</b> sends the next wave early for a bonus. <b>Q</b> calls a barrage and <b>W</b> slows every enemy.</p>
    <div class="row"><button class="btn primary" id="ov-start" type="button">Take command</button></div>`);
  els.card.querySelectorAll('.map-btn').forEach(b => b.onclick = () => {
    ui.map = +b.dataset.map; loadMap(ui.map);
    els.card.querySelectorAll('.map-btn').forEach(x => x.classList.toggle('on', x === b));
  });
  $('ov-start').onclick = () => { initAudio(); restart(); };
  $('ov-start').focus();
  refreshHud();
}
function toTitle() { S = newState(); loadMap(ui.map); ui.selected = null; ui.build = null; refreshPanel(true); titleScreen(); }
function gameOver() {
  S.over = true; saveBest(S.wave - 1); sfx('lose');
  setTimeout(() => {
    showOverlay(`
      <h2>The gate <span>fell</span></h2>
      <p>You held through ${Math.max(0, S.wave - 1)} wave${S.wave - 1 === 1 ? '' : 's'} on ${MAPS[MAP_I].name} with ${fmt(S.totalKills)} enemies defeated.</p>
      <p>Best on this map: wave ${bestWave()}</p>
      <div class="row"><button class="btn primary" id="ov-again" type="button">Try again</button><button class="btn" id="ov-maps" type="button">Change map</button></div>`);
    $('ov-again').onclick = restart; $('ov-maps').onclick = toTitle; $('ov-again').focus();
  }, 600);
}
function victory() {
  ui.paused = true; sfx('win');
  showOverlay(`
    <h2>The line <span>held</span></h2>
    <p>All ${VICTORY_WAVE} waves defeated with ${S.lives} li${S.lives === 1 ? 'fe' : 'ves'} left and ${fmt(S.totalKills)} enemies down.</p>
    <div class="row"><button class="btn primary" id="ov-endless" type="button">Keep going (endless)</button><button class="btn" id="ov-maps" type="button">Change map</button></div>`);
  $('ov-endless').onclick = () => { S.endless = true; hideOverlay(); ui.paused = false; refreshHud(); };
  $('ov-maps').onclick = toTitle;
}
function restart() {
  S = newState(); loadMap(ui.map);
  ui.selected = null; ui.build = null; ui.targeting = null; ui.perkOpen = false; ui.paused = false; ui.started = true;
  hideOverlay(); refreshPanel(true); refreshHud();
}
function offerPerks() {
  const pool = PERKS.filter(p => !S.perks.includes(p.id)), picks = [];
  while (picks.length < 3 && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  if (!picks.length) return;
  ui.perkChoices = picks; ui.perkOpen = true; ui.paused = true; ui.targeting = null; sfx('perk');
  showOverlay(`
    <h2>Field <span>orders</span></h2>
    <p>Choose one. Every gift has a price.</p>
    <div class="perks">${picks.map((p, i) => `<button class="perk" type="button" data-i="${i}"><span class="pk-key">${i + 1}</span><span class="pk-name">${p.name}</span><span class="pk-up">+ ${p.up}</span><span class="pk-down">− ${p.down}</span></button>`).join('')}</div>`, 'wide');
  els.card.querySelectorAll('.perk').forEach(b => b.onclick = () => pickPerk(+b.dataset.i));
}
function pickPerk(i) {
  const p = ui.perkChoices[i];
  if (!p || !ui.perkOpen) return;
  p.apply(S.mods); S.modVer++; S.perks.push(p.id);
  ui.perkOpen = false; ui.paused = false; hideOverlay(); sfx('upgrade');
  refreshPanel(true); refreshHud();
}

// ===================================================================
// Input
// ===================================================================
function evPx(ev) {
  const r = canvas.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H];
}
canvas.addEventListener('pointermove', ev => { const [x, y] = evPx(ev); ui.hoverPx = [x, y]; ui.hoverTile = [Math.floor(x / TILE), Math.floor(y / TILE)]; });
canvas.addEventListener('pointerleave', () => { ui.hoverTile = null; ui.hoverPx = null; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); ui.build = null; ui.selected = null; ui.targeting = null; refreshPanel(true); refreshHud(); });
canvas.addEventListener('pointerdown', ev => {
  if (ev.button !== 0 || S.over || !ui.started || ui.perkOpen) return;
  const [px, py] = evPx(ev), tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  ui.hoverPx = [px, py]; ui.hoverTile = [tx, ty];
  if (ui.targeting) { useAbility(ui.targeting, px, py); ui.targeting = null; refreshHud(); return; }
  const existing = towerAt(tx, ty);
  if (existing) { ui.selected = existing; ui.build = null; }
  else if (ui.build) {
    const t = placeTower(ui.build, tx, ty);
    if (t && S.gold < buildCost(ui.build)) { ui.build = null; ui.selected = t; }
  } else ui.selected = null;
  refreshPanel(true); refreshHud();
});

els.btnWave.onclick = () => { startWave(); refreshHud(); refreshPanel(true); };
els.btnSpeed.onclick = () => { ui.speed = ui.speed === 3 ? 1 : ui.speed + 1; refreshHud(); };
els.btnPause.onclick = () => { ui.paused = !ui.paused; refreshHud(); };
function toggleSound() {
  A.on = !A.on;
  try { localStorage.setItem('bastion-line-mute', A.on ? '0' : '1'); } catch (e) {}
  if (A.on) { initAudio(); sfx('build'); }
  refreshHud();
}
els.btnSound.onclick = toggleSound;
els.ab.strike.onclick = toggleStrike;
els.ab.snap.onclick = () => { useAbility('snap'); refreshHud(); };

window.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input, textarea')) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'm') { toggleSound(); return; }
  if (!ui.started) return;
  if (ui.perkOpen) { const n = +k; if (n >= 1 && n <= 3) pickPerk(n - 1); return; }
  const idx = ['1', '2', '3', '4', '5'].indexOf(k);
  if (idx >= 0) { selectBuild(ui.build === TOWER_KEYS[idx] ? null : TOWER_KEYS[idx]); return; }
  if (k === 'escape') { ui.build = null; ui.selected = null; ui.targeting = null; refreshPanel(true); refreshHud(); }
  else if (k === ' ') { ev.preventDefault(); if (!S.over) els.btnWave.click(); }
  else if (k === 'p') els.btnPause.click();
  else if (k === 'f') els.btnSpeed.click();
  else if (k === 'q') { toggleStrike(); refreshHud(); }
  else if (k === 'w') { useAbility('snap'); refreshHud(); }
  else if (ui.selected && k === 'u') { upgradeTower(ui.selected, 0); refreshPanel(true); }
  else if (ui.selected && k === 'i' && ui.selected.lvl === 1) { upgradeTower(ui.selected, 1); refreshPanel(true); }
  else if (ui.selected && (k === 's' || k === 'delete' || k === 'backspace')) { sellTower(ui.selected); refreshPanel(true); }
  else if (ui.selected && k === 't') {
    const i = MODES.findIndex(m => m[0] === ui.selected.mode);
    ui.selected.mode = MODES[(i + 1) % MODES.length][0]; refreshPanel(true);
  }
});

// ===================================================================
// Loop
// ===================================================================
let last = performance.now(), uiTimer = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (ui.started && !ui.paused && !S.over) {
    let remaining = real * ui.speed;
    while (remaining > 0) { const step = Math.min(1 / 60, remaining); update(step); remaining -= step; if (ui.paused || S.over) break; }
  } else updateFx(0);
  render();
  uiTimer -= real;
  if (uiTimer <= 0) { uiTimer = 0.15; refreshHud(); refreshPanel(false); }
  requestAnimationFrame(frame);
}

S = newState(); loadMap(ui.map);
refreshPanel(true); refreshHud(); titleScreen();
requestAnimationFrame(frame);

// Test hook for automated play-throughs.
window.__bastion = { get S() { return S; }, get pathSet() { return pathSet; }, get air() { return [airA, airB]; }, ui, TOWERS, ENEMIES, MAPS, placeTower, upgradeTower, upgradeCost, buildCost, startWave, update, tileFree, waveGroups, restart, loadMap, pickPerk, offerPerks, useAbility, strikeBlast };
})();
</script>
